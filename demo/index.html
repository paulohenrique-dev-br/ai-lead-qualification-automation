<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Lead Qualification Automation - Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #5f6b7a;
        --border: #d7dde5;
        --accent: #0f62fe;
        --success: #0f7b46;
        --error: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 20px 72px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 8px 24px rgb(23 32 42 / 5%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        font-weight: 600;
      }

      label.full {
        grid-column: 1 / -1;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
      }

      textarea {
        resize: vertical;
        min-height: 108px;
      }

      button {
        grid-column: 1 / -1;
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        padding: 12px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .result {
        margin-top: 20px;
        border-radius: 10px;
        padding: 14px 16px;
        display: none;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }

      .result.success {
        display: block;
        background: #ecfdf3;
        border: 1px solid #a9efc5;
        color: var(--success);
      }

      .result.error {
        display: block;
        background: #fef3f2;
        border: 1px solid #fecdca;
        color: var(--error);
      }

      @media (max-width: 560px) {
        .grid {
          grid-template-columns: 1fr;
        }

        label.full {
          grid-column: auto;
        }

        button {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>AI Lead Qualification Automation</h1>
        <p class="subtitle">
          Synthetic portfolio demo. Submit a lead to the n8n webhook and see
          the qualified result.
        </p>

        <form id="lead-form">
          <div class="grid">
            <label>
              Name
              <input name="name" required autocomplete="name" />
            </label>
            <label>
              Email
              <input name="email" type="email" required autocomplete="email" />
            </label>
            <label>
              Company
              <input name="company" autocomplete="organization" />
            </label>
            <label>
              Company size
              <input name="company_size" type="number" min="1" step="1" />
            </label>
            <label>
              Budget (USD)
              <input name="budget" type="number" min="0" step="any" />
            </label>
            <label>
              Source
              <select name="source">
                <option value="website">Website</option>
                <option value="linkedin">LinkedIn</option>
                <option value="referral">Referral</option>
                <option value="partner">Partner</option>
                <option value="event">Event</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label class="full">
              Message
              <textarea name="message" required></textarea>
            </label>
            <button type="submit">Qualify lead</button>
          </div>
        </form>

        <div id="result" class="result" role="status"></div>
      </section>
    </main>

    <script src="./config.js"></script>
    <script>
      (function () {
        const config = window.APP_CONFIG || {};
        const webhookUrl =
          config.webhookUrl || "http://localhost:5678/webhook/lead-qualification";
        const timeoutMs = config.timeoutMs || 30000;
        const form = document.getElementById("lead-form");
        const result = document.getElementById("result");
        const button = form.querySelector("button");

        function makeSubmissionId() {
          if (window.crypto && typeof window.crypto.randomUUID === "function") {
            return window.crypto.randomUUID();
          }

          return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
            /[xy]/g,
            function (char) {
              const random = (Math.random() * 16) | 0;
              const value = char === "x" ? random : (random & 0x3) | 0x8;
              return value.toString(16);
            },
          );
        }

        function showResult(type, payload) {
          result.className = "result " + type;
          result.textContent =
            typeof payload === "string"
              ? payload
              : JSON.stringify(payload, null, 2);
        }

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          button.disabled = true;
          showResult("success", "Sending lead...");

          const data = new FormData(form);
          const payload = {
            submission_id: makeSubmissionId(),
            name: String(data.get("name") || "").trim(),
            email: String(data.get("email") || "").trim(),
            company: String(data.get("company") || "").trim(),
            company_size: data.get("company_size")
              ? Number(data.get("company_size"))
              : null,
            budget: data.get("budget") ? Number(data.get("budget")) : null,
            message: String(data.get("message") || "").trim(),
            source: String(data.get("source") || "website").trim(),
          };

          const controller = new AbortController();
          const timer = setTimeout(function () {
            controller.abort();
          }, timeoutMs);

          try {
            const response = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              signal: controller.signal,
            });

            let body = null;
            try {
              body = await response.json();
            } catch (_) {
              body = null;
            }

            if (!response.ok) {
              showResult("error", {
                http_status: response.status,
                error: body || "The webhook rejected the request.",
              });
              return;
            }

            showResult("success", body);
          } catch (error) {
            showResult("error", {
              error:
                error.name === "AbortError"
                  ? "Request timed out."
                  : error.message,
            });
          } finally {
            clearTimeout(timer);
            button.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
